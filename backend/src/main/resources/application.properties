server.port=8080

# --- Database: H2 file DB by default (zero setup). For MySQL, swap these four lines. ---
spring.datasource.url=jdbc:h2:file:./data/collegedb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
#spring.datasource.url=jdbc:mysql://localhost:3306/college_db?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=root

# --- JWT (secret must be at least 32 characters; override with env var in production) ---
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-at-least-32-chars}
app.jwt.expiration-ms=86400000
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# --- Google OAuth2 (create credentials at console.cloud.google.com) ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=profile,email
